workflows:
  accessible-backrooms-ios:
    name: Accessible Backrooms iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          # Sideloaded builds have no iCloud entitlement, and CloudKit crashes without it,
          # so the iCloud plugin only goes into the signed App Store build.
          npm uninstall capacitor-icloud-sync --legacy-peer-deps
      - name: Capacitor sync
        script: |
          npx cap sync ios
      - name: Build unsigned .app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r App.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa

  accessible-backrooms-appstore:
    name: Accessible Backrooms App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.accessible.backrooms
      node: v20.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Capacitor sync
        script: |
          npx cap sync ios
      - name: Signing profile with Game Center
        script: |
          python3 -m venv /tmp/gcenv
          /tmp/gcenv/bin/pip install --quiet pyjwt cryptography requests
          /tmp/gcenv/bin/python tools/signing/gc_profile.py
      - name: Use the App Store signing profile
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false  # internal testers get every build anyway; true tries external beta review and fails without Test Information

  cloudkit-schema:
    name: CloudKit schema (one time)
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      groups:
        - cloudkit
      xcode: latest
    scripts:
      - name: Add the iCloud save record type
        script: |
          ./cloudkit/import-schema.sh

  game-center-setup:
    name: Game Center setup (achievements and leaderboards)
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    scripts:
      - name: Create the achievements and leaderboards in App Store Connect
        script: |
          python3 -m venv /tmp/gcenv
          /tmp/gcenv/bin/pip install --quiet pyjwt cryptography requests
          /tmp/gcenv/bin/python tools/gamecenter/create.py

  # Attaches Game Center (all achievements and leaderboards) to the version
  # waiting to be submitted, and fills in What's New. Replaces the Game Center
  # section of the version page, which is hard to use with VoiceOver.
  game-center-attach:
    name: Game Center, attach to the new version
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      vars:
        WHATS_NEW_EN: "Game Center is here: all 53 achievements and three leaderboards are now live, for Endless mode depth, Hunter mode catches and your daily challenge streak. Achievements you already earned are sent when you sign in."
        WHATS_NEW_PT: "O Game Center chegou: as 53 conquistas e três placares agora estão no ar, para profundidade no modo infinito, capturas no Modo Caçador e sequência do desafio diário. Conquistas que você já ganhou são enviadas quando você entra."
    scripts:
      - name: Attach Game Center and fill in What's New
        script: |
          python3 -m venv /tmp/gcenv
          /tmp/gcenv/bin/pip install --quiet pyjwt cryptography requests
          cd tools/gamecenter && /tmp/gcenv/bin/python -u attach_version.py

  # Moves every App Store link (privacy, support, marketing) from the old
  # Netlify sites to their Cloudflare addresses, for all the apps.
  fix-app-store-links:
    name: Fix App Store links (Netlify to Cloudflare)
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    scripts:
      - name: Update the links
        script: |
          python3 -m venv /tmp/gcenv
          /tmp/gcenv/bin/pip install --quiet pyjwt cryptography requests
          /tmp/gcenv/bin/python tools/appstore-links/fix_links.py

  # Android: a test APK you can install on a phone (not signed for the Play Store).
  backrooms-android-test:
    name: Accessible Backrooms Android (test APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: v20.14.0
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Capacitor sync
        script: |
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  # Android: the signed bundle (AAB) only, without sending it anywhere. Google
  # Play wants the very first upload of a new app done by hand in Play Console.
  backrooms-android-bundle:
    name: Accessible Backrooms Android bundle (for the first upload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: v20.14.0
      android_signing:
        - dungeon-descent-android
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Capacitor sync
        script: |
          npx cap sync android
      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
