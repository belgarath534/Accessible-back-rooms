workflows:
  accessible-backrooms-ios:
    name: Accessible Backrooms iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          # Sideloaded builds have no iCloud entitlement, and CloudKit crashes without it,
          # so the iCloud plugin only goes into the signed App Store build.
          npm uninstall capacitor-icloud-sync --legacy-peer-deps
      - name: Capacitor sync
        script: |
          npx cap sync ios
      - name: Build unsigned .app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r App.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa

  accessible-backrooms-appstore:
    name: Accessible Backrooms App Store
    max_build_duration: 60
    instance_type: mac_mini_m4
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.accessible.backrooms
      node: v20.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Capacitor sync
        script: |
          npx cap sync ios
      - name: Use the App Store signing profile
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  cloudkit-schema:
    name: CloudKit schema (one time)
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      groups:
        - cloudkit
      xcode: latest
    scripts:
      - name: Add the iCloud save record type
        script: |
          ./cloudkit/import-schema.sh
