# Builds Accessible Backrooms for Android, signs it with the upload key, and
# sends it to Google Play's Closed testing track. Free on GitHub (no Codemagic).
# Run by hand: Actions → Android release → Run workflow.
# Secrets: ANDROID_KEYSTORE_BASE64 (the .jks file as base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS.
name: Android release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track (alpha = Closed testing, production = everyone)
        type: choice
        options: [alpha, internal, production]
        default: alpha

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and sync
        run: |
          npm install --legacy-peer-deps
          npx cap sync android
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret first"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > $RUNNER_TEMP/upload.jks
          ls -la $RUNNER_TEMP/upload.jks
      - name: Build signed AAB
        env:
          CM_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Codemagic's builds used version codes up to the low tens; GitHub's start above them.
          sed -i "s/versionCode [0-9]*/versionCode $((GITHUB_RUN_NUMBER + 100))/" android/app/build.gradle
          grep versionCode android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS }}
        run: |
          pip install --quiet pyjwt cryptography requests
          cd tools/googleplay && python -u upload.py ../../android/app/build/outputs/bundle/release/app-release.aab ${{ inputs.track }}
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-android
          path: android/app/build/outputs/bundle/release/*.aab
